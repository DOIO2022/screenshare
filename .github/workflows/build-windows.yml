name: Build Windows client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "使用说明.txt"
      - "如何生成绿色版.txt"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build folder release
        run: python -m PyInstaller --noconfirm --clean LanShare.spec

      - name: Build one-file exe
        run: python -m PyInstaller --noconfirm --clean LanShare-onefile.spec

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LanShare-Windows-no-install
          path: |
            dist/LanShare-win32-x64/
            dist/LanShare.exe
            使用说明.txt
